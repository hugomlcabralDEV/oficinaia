<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia Rec'n'Play</title>
<style>
  :root {
    --fundo:#0F1420; --painel:#1A2233; --borda:#2A3347; --texto:#F3F1EA; --suave:#A3ACBA;
    --azul:#4285F4; --vermelho:#EA4335; --amarelo:#FBBC04; --verde:#34A853; --codigo:#0B1019;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--fundo); color:var(--texto); height:100vh; display:flex; flex-direction:column; }
  .faixa { height:6px; background:linear-gradient(90deg,var(--azul) 25%,var(--vermelho) 25% 50%,var(--amarelo) 50% 75%,var(--verde) 75%); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 24px; border-bottom:1px solid var(--borda); }
  header h1 { margin:0; font-size:20px; } header small { color:var(--suave); }
  .acoes button { background:var(--painel); color:var(--texto); border:1px solid var(--borda); border-radius:8px; padding:8px 12px; cursor:pointer; font-size:14px; }
  .acoes button:hover { border-color:var(--azul); }
  main { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px; max-width:900px; width:100%; margin:0 auto; }
  .msg { padding:14px 18px; border-radius:14px; line-height:1.5; white-space:pre-wrap; max-width:85%; }
  .voce { align-self:flex-end; background:var(--azul); color:#fff; border-bottom-right-radius:4px; }
  .guia { align-self:flex-start; background:var(--painel); border:1px solid var(--borda); border-bottom-left-radius:4px; }
  .erro { align-self:flex-start; background:#3A1C1C; border:1px solid var(--vermelho); }
  details { align-self:flex-start; max-width:85%; font-size:13px; color:var(--suave); }
  details pre { background:var(--codigo); padding:12px; border-radius:8px; overflow-x:auto; white-space:pre-wrap; color:#E8EAED; }
  .sugestoes { display:flex; flex-wrap:wrap; gap:8px; }
  .sugestoes button { background:transparent; color:var(--texto); border:1px dashed var(--borda); border-radius:999px; padding:8px 14px; cursor:pointer; font-size:14px; }
  .sugestoes button:hover { border-color:var(--amarelo); }
  form { display:flex; gap:12px; padding:16px 24px 24px; max-width:900px; width:100%; margin:0 auto; }
  input { flex:1; background:var(--painel); border:1px solid var(--borda); color:var(--texto); border-radius:12px; padding:14px 16px; font-size:16px; }
  input:focus { outline:2px solid var(--azul); }
  form button { background:var(--amarelo); color:#1A1A1A; border:0; border-radius:12px; padding:0 22px; font-weight:700; font-size:16px; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<div class="faixa"></div>
<header>
  <div><h1 id="nome">Guia Rec'n'Play 🤖</h1><small id="modelo">Agente com Gemini API e function calling</small></div>
  <div class="acoes">
    <button id="btnAgenda" title="Ver minha agenda">📅 Agenda</button>
    <button id="btnJson" title="Última resposta como JSON">{ } JSON</button>
    <button id="btnNova" title="Começar do zero">↺ Nova conversa</button>
  </div>
</header>

<main id="chat">
  <div class="msg guia">Olá! Posso consultar a programação, ver o clima, buscar endereço por CEP e montar sua agenda. O que você quer fazer?</div>
  <div class="sugestoes" id="sugestoes">
    <button>Quais oficinas de IA tem na sexta?</button>
    <button>Vai chover em Recife nos próximos dias?</button>
    <button>Adiciona a oficina de agentes na minha agenda</button>
    <button>Monte meu sábado com IA e carreira, sem conflito</button>
  </div>
</main>

<form id="form">
  <input id="entrada" placeholder="Pergunte algo ao agente..." autocomplete="off" maxlength="2000">
  <button id="enviar">Enviar</button>
</form>

<script>
  // Cada aba tem um id de sessão. É isso que dá "memória" separada para cada pessoa.
  function novaSessao() {
    const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/[^a-zA-Z0-9-]/g, "");
    sessionStorage.setItem("sessao", id);
    return id;
  }
  let sessao = sessionStorage.getItem("sessao") || novaSessao();

  const chat = document.getElementById("chat");
  const entrada = document.getElementById("entrada");
  const enviar = document.getElementById("enviar");

  function adicionar(texto, classe) {
    const div = document.createElement("div");
    div.className = "msg " + classe;
    div.textContent = texto;          // textContent evita injeção de HTML
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function mostrarPassos(passos) {
    if (!passos || !passos.length) return;
    const d = document.createElement("details");
    const s = document.createElement("summary");
    s.textContent = `🔧 ${passos.length} chamada(s) de ferramenta — clique para ver`;
    const pre = document.createElement("pre");
    pre.textContent = passos.map(p =>
      `passo ${p.passo}: ${p.ferramenta}(${JSON.stringify(p.argumentos)})\n  ↳ ${JSON.stringify(p.resultado).slice(0, 400)}`
    ).join("\n\n");
    d.append(s, pre);
    chat.appendChild(d);
  }

  async function chamar(url, corpo) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    const dados = await r.json();
    if (!r.ok) throw new Error(dados.detail || "Erro no servidor");
    return dados;
  }

  async function perguntar(texto) {
    document.getElementById("sugestoes")?.remove();
    adicionar(texto, "voce");
    enviar.disabled = true;
    const pensando = adicionar("Pensando…", "guia");
    try {
      const dados = await chamar("/api/chat", { sessao, mensagem: texto });
      pensando.remove();
      mostrarPassos(dados.passos);
      adicionar(dados.resposta, "guia");
    } catch (e) {
      pensando.remove();
      adicionar("⚠ " + e.message, "erro");
    } finally {
      enviar.disabled = false;
      entrada.focus();
    }
  }

  document.getElementById("form").addEventListener("submit", ev => {
    ev.preventDefault();
    const texto = entrada.value.trim();
    if (!texto) return;
    entrada.value = "";
    perguntar(texto);
  });
  document.querySelectorAll("#sugestoes button").forEach(b => b.addEventListener("click", () => perguntar(b.textContent)));

  document.getElementById("btnNova").onclick = async () => {
    await chamar("/api/nova", { sessao }).catch(() => {});
    sessao = novaSessao();
    chat.innerHTML = "";
    adicionar("Conversa nova. Como posso ajudar?", "guia");
  };
  document.getElementById("btnJson").onclick = async () => {
    try { adicionar(JSON.stringify(await chamar("/api/json", { sessao }), null, 2), "guia"); }
    catch (e) { adicionar("⚠ " + e.message, "erro"); }
  };
  document.getElementById("btnAgenda").onclick = async () => {
    const r = await fetch("/api/agenda"); const a = await r.json();
    adicionar(a.total ? "📅 Sua agenda:\n" + a.atividades.map(x => `• ${x.id} · ${x.dia} ${x.inicio}–${x.fim} · ${x.titulo} (${x.local})`).join("\n")
                      : "📅 Sua agenda está vazia.", "guia");
  };

  fetch("/api/info").then(r => r.json()).then(i => {
    document.getElementById("nome").textContent = i.nome + " 🤖";
    document.getElementById("modelo").textContent = "Modelo: " + i.modelo + " · function calling";
    document.title = i.nome;
  }).catch(() => {});
</script>
</body>
</html>
